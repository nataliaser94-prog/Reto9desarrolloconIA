<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golygol | Distribuidora de Balones</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">

    <!-- Barra de propuesta de valor: mensaje promocional -->
    <div class="header__topbar">
      <p>Diseños personalizados y publicidad deportiva para tu equipo, empresa o evento</p>
    </div>

    <!-- Fila principal: identidad visual (logo) + navegación -->
    <div class="header__main">

      <a href="#" class="logo" aria-label="Golygol - Inicio">
        <img class="logo__imagen" src="img/logo-golygol.png" alt="Golygol">
      </a>

      <nav class="nav" aria-label="Navegación principal">
        <ul class="nav__lista">
          <li><a href="#futbol">Balones Fútbol</a></li>
          <li><a href="#microfutbol">Balones Microfútbol</a></li>
          <li><a href="#voleibol">Voleibol</a></li>
          <li><a href="#accesorios">Accesorios</a></li>
          <li><a href="#contacto">Contáctanos</a></li>
        </ul>
      </nav>

    </div>

    <!-- Testimonios visuales: experiencia y trabajo con clientes -->
    <div class="header__galeria">
      <img src="img/publicidad-empresa.png" alt="Banner Golygol: tu marca también juega, balones personalizados para empresas y eventos" width="160" height="107">
      <img src="img/publicidad-equipo.png" alt="Banner Golygol: publicidad para tu equipo, diseños personalizados en balones" width="160" height="107">
    </div>

  </header>

</body>
</html>
